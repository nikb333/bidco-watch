name: Daily ACN sweep

on:
  schedule:
    # Three starts a night, Sydney time: 10pm, 2am, 5am.
    #
    # The sweep is resumable by construction - it reads the checkpoint and
    # queues whatever is still outstanding - so a second start simply continues
    # the first. That is why there are three rather than one: GitHub caps a
    # hosted job at six hours, and a job cannot lift that by dispatching itself,
    # because events raised with the built-in GITHUB_TOKEN deliberately do not
    # start new workflow runs. Extra scheduled starts are the mechanism that
    # actually works. If the 10pm run finished everything, the later two find an
    # almost-empty queue and exit in minutes.
    #
    # Fire EVERY hour at :23 and let the guard below decide. Twenty-one of the
    # twenty-four firings exit in about eight seconds, which costs nothing on a
    # public repo, and hourly removes a trap that a two-hourly schedule walks
    # straight into.
    #
    # The trap: cron knows nothing about daylight saving, so each Sydney start
    # time has two UTC candidates and the guard drops whichever is wrong -
    #   22:00 Sydney -> 12:00 UTC (AEST) / 11:00 UTC (AEDT)
    #   02:00 Sydney -> 16:00 UTC (AEST) / 15:00 UTC (AEDT)
    #   05:00 Sydney -> 19:00 UTC (AEST) / 18:00 UTC (AEDT)
    # "*/2" only ever fires on EVEN UTC hours. So on AEST it could never reach
    # 19:00, and from 4 October, when Sydney goes to AEDT, 11:00 and 15:00 both
    # become unreachable too and the whole schedule collapses to a single 5am
    # start. Hourly has no parity to get wrong.
    #
    # The odd minute is deliberate: GitHub's scheduler is best effort and drops
    # jobs under load, and the top of the hour is when every cron on the platform
    # fires at once.
    #
    # The guard runs at the three Sydney start times, AND any time the last
    # successful run is more than twenty hours old. That second clause is the
    # point: when GitHub drops a night, the next firing picks the work up instead
    # of waiting for someone to notice.
    - cron: "23 * * * *"
  workflow_dispatch:        # this is the "Run now" button

permissions:
  contents: write

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 355    # GitHub's hard ceiling for a hosted job is 360
    steps:
      - uses: actions/checkout@v4

      - name: Should this firing actually sweep?
        id: guard
        run: |
          H=$(TZ=Australia/Sydney date +%H)
          case "$H" in 22|02|05) SLOT=yes ;; *) SLOT=no ;; esac

          # How long since a run last finished successfully? A heredoc would be
          # cleaner but an indented terminator does not close one, so this is a
          # single expression on purpose.
          AGE=$(python3 -c "import json,datetime as d;t=json.load(open('data/state.json'))['last_run']['finished_utc'];print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(t.replace('Z','+00:00'))).total_seconds()//3600))" 2>/dev/null || echo 999)
          echo "sydney hour $H | scheduled slot: $SLOT | hours since last run: $AGE"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual run"; echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$SLOT" = "yes" ]; then
            echo "scheduled start"; echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$AGE" -ge 20 ]; then
            echo "::warning::Last successful run was $AGE hours ago - catching up."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "nothing due"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.guard.outputs.skip == 'false'
        run: pip install -r requirements.txt

      - name: Let the sweep publish progress as it goes
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name  "bidco-watch"
          git config user.email "actions@github.com"
          git config pull.rebase true

      - name: Sweep
        if: steps.guard.outputs.skip == 'false'
        id: sweep
        continue-on-error: true      # a failed sweep must still publish its failure
        env:
          BAPI_KEY: ${{ secrets.BAPI_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python sweep.py

      - name: Build site
        if: steps.guard.outputs.skip == 'false'
        env:
          SITE_PASSCODE: ${{ secrets.SITE_PASSCODE }}
        run: python build_site.py

      - name: Commit
        if: steps.guard.outputs.skip == 'false'
        run: |
          git add -A data docs
          git diff --staged --quiet || git commit -m "sweep $(date -u +%Y-%m-%dT%H:%MZ)"
          # The sweep pushes progress while it runs, and a person may push at the
          # same time, so the branch can have moved underneath us. Rebase and
          # retry rather than pushing into a rejection.
          #
          # -X theirs, not -X ours. During a REBASE the sides are inverted from
          # what the words suggest: "ours" is the branch being replayed onto
          # (origin/main) and "theirs" is the commit being replayed (this run's
          # results). "-X ours" therefore threw away the sweep's own data on every
          # conflict and kept the stale copy from the remote - which is exactly
          # why data/state.json sat frozen at 10 September while runs kept
          # finishing. We want the sweep's side, so: theirs.
          for i in 1 2 3 4 5; do
            git fetch origin main || true
            git rebase -X theirs origin/main || { git rebase --abort || true; sleep 5; continue; }
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "::error::could not push after 5 attempts"
          exit 1

      # A run can finish green, push commits, and still have quietly lost its
      # results - that is precisely what happened between 10 and 12 September.
      # data/state.json is the one file that proves the run landed, so read it
      # back from what is actually on origin and check it moved. A silent loss
      # becomes a red X instead of two days of nothing.
      - name: Did the run's results actually land?
        if: steps.guard.outputs.skip == 'false' && steps.sweep.outcome == 'success'
        run: |
          git fetch origin main
          git show origin/main:data/state.json > /tmp/pushed-state.json
          python3 -c "import json,datetime as d,sys;t=json.load(open('/tmp/pushed-state.json'))['last_run']['finished_utc'];age=(d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(t.replace('Z','+00:00'))).total_seconds()/60;print(f'state.json on origin says the last run finished {age:.0f} minutes ago ({t})');sys.exit(0 if age < 90 else 1)" || {
            echo "::error::The sweep finished but its results are not on origin - state.json was not updated. Work has been lost; do not trust the dashboard."
            exit 1
          }

      - name: Fail the run if the sweep failed
        if: steps.guard.outputs.skip == 'false' && steps.sweep.outcome == 'failure'
        run: |
          echo "The sweep reported a failure. The site has been rebuilt showing it."
          exit 1
