name: Daily ACN sweep

on:
  schedule:
    # One start a night inside a 10pm-8am Sydney window, and another only if the
    # previous one ran out of clock.
    #
    # The sweep is resumable by construction - it reads the checkpoint and queues
    # whatever is still outstanding - which matters because GitHub caps a hosted
    # job at six hours and a job cannot lift that by dispatching itself: events
    # raised with the built-in GITHUB_TOKEN deliberately do not start new workflow
    # runs. Extra starts are the only mechanism that works. This used to be three
    # fixed slots (10pm, 2am, 5am) on the theory that the later two would find an
    # empty queue and exit in seconds. The guard below now asks the question those
    # slots were a proxy for - is there work left? - so a truncated run resumes on
    # the next firing instead of waiting for 2am, and a complete one is not
    # followed by two no-ops.
    #
    # Fire EVERY hour at :23 and let the guard below decide. Twenty-one of the
    # twenty-four firings exit in about eight seconds, which costs nothing on a
    # public repo, and hourly removes a trap that a two-hourly schedule walks
    # straight into.
    #
    # The trap: cron knows nothing about daylight saving, so each Sydney start
    # time has two UTC candidates and the guard drops whichever is wrong -
    #   22:00 Sydney -> 12:00 UTC (AEST) / 11:00 UTC (AEDT)
    #   02:00 Sydney -> 16:00 UTC (AEST) / 15:00 UTC (AEDT)
    #   05:00 Sydney -> 19:00 UTC (AEST) / 18:00 UTC (AEDT)
    # "*/2" only ever fires on EVEN UTC hours. So on AEST it could never reach
    # 19:00, and from 4 October, when Sydney goes to AEDT, 11:00 and 15:00 both
    # become unreachable too and the whole schedule collapses to a single 5am
    # start. Hourly has no parity to get wrong.
    #
    # The odd minute is deliberate: GitHub's scheduler is best effort and drops
    # jobs under load, and the top of the hour is when every cron on the platform
    # fires at once.
    #
    # The guard runs at the three Sydney start times, AND any time the last
    # successful run is more than twenty hours old. That second clause is the
    # point: when GitHub drops a night, the next firing picks the work up instead
    # of waiting for someone to notice.
    - cron: "23 * * * *"
  workflow_dispatch:        # this is the "Run now" button

permissions:
  contents: write

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 355    # GitHub's hard ceiling for a hosted job is 360
    steps:
      - uses: actions/checkout@v4

      - name: Should this firing actually sweep?
        id: guard
        run: |
          # Anchor on the CLOCK, not on elapsed time.
          #
          # The old guard matched the Sydney hour exactly - 22, 02 or 05 - and
          # otherwise fell back to "last run finished more than 20 hours ago".
          # GitHub's hourly cron is best effort and drops firings, so the
          # exact-hour match kept missing, and the 20-hour rule became the real
          # scheduler. It had only three hours of headroom over the longest
          # legitimate gap between slots (05:00 -> 22:00 = 17h), so it almost
          # always fired before a slot could come round, and the intended cadence
          # never re-established itself.
          #
          # The start time then free-ran: next start = last finish + 20h + however
          # long the run took, which walks about an hour earlier each day, while a
          # short run reset the timer early and knocked it hours off and a late
          # firing pushed it later with nothing to pull it back. Over the 26 runs
          # to 27 November 2026 only 5 began in a slot hour, the median
          # finish-to-start gap was 20.2 hours, and the sweep had wandered from
          # about 1am to about 7am.
          #
          # So: sweep anywhere in the 22:00-07:59 Sydney window if no run has
          # STARTED since the most recent 22:00 boundary. A late firing still
          # counts instead of missing its slot, exactly one run happens per night,
          # and the time self-corrects after a short run or a dropped firing.
          # slots_left > 0 means the last run hit its budget with work still
          # queued, so it resumes on the very next firing rather than waiting.
          #
          # The elapsed-time rule stays, raised to 26 hours, where it is what it
          # was always meant to be: a backstop for GitHub dropping a whole night.
          #
          # One expression on purpose - a heredoc will not close on an indented
          # terminator. The fallback is "no", not "yes": if state.json is
          # unreadable the 999 lands on the backstop and sweeps once, rather than
          # every firing sweeping and hammering the vendor API.
          D=$(python3 -c "import json,datetime as d;from zoneinfo import ZoneInfo;S=ZoneInfo('Australia/Sydney');n=d.datetime.now(d.timezone.utc);L=n.astimezone(S);a=L.replace(hour=22,minute=0,second=0,microsecond=0)-d.timedelta(days=1 if L.hour<22 else 0);r=json.load(open('data/state.json'))['last_run'];p=lambda t:d.datetime.fromisoformat(t.replace('Z','+00:00'));s=p(r.get('started_utc') or r['finished_utc']);print(L.hour,int((n-p(r['finished_utc'])).total_seconds()//3600),'yes' if (L.hour>=22 or L.hour<8) and (s<a or int(r.get('slots_left') or 0)>0) else 'no',s.astimezone(S).strftime('%d-%b-%H:%M'),a.strftime('%d-%b-%H:%M'),int(r.get('slots_left') or 0))" 2>/dev/null || echo "99 999 no unknown unknown 0")
          set -- $D; H=$1; AGE=$2; DUE=$3; LAST=$4; ANCHOR=$5; LEFT=$6
          echo "sydney hour $H | last run started $LAST | tonight's window opened $ANCHOR | slots left over $LEFT | due tonight: $DUE | hours since last finish: $AGE"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual run"; echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$DUE" = "yes" ]; then
            echo "nightly start"; echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$AGE" -ge 26 ]; then
            echo "::warning::Last successful run was $AGE hours ago - catching up."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "nothing due"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.guard.outputs.skip == 'false'
        run: pip install -r requirements.txt

      - name: Let the sweep publish progress as it goes
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name  "bidco-watch"
          git config user.email "actions@github.com"
          git config pull.rebase true

      - name: Sweep
        if: steps.guard.outputs.skip == 'false'
        id: sweep
        continue-on-error: true      # a failed sweep must still publish its failure
        env:
          BAPI_KEY: ${{ secrets.BAPI_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python sweep.py

      - name: Build site
        if: steps.guard.outputs.skip == 'false'
        env:
          SITE_PASSCODE: ${{ secrets.SITE_PASSCODE }}
        run: python build_site.py

      - name: Commit
        if: steps.guard.outputs.skip == 'false'
        run: |
          git add -A data docs
          git diff --staged --quiet || git commit -m "sweep $(date -u +%Y-%m-%dT%H:%MZ)"
          # The sweep pushes progress while it runs, and a person may push at the
          # same time, so the branch can have moved underneath us. Rebase and
          # retry rather than pushing into a rejection.
          #
          # -X theirs, not -X ours. During a REBASE the sides are inverted from
          # what the words suggest: "ours" is the branch being replayed onto
          # (origin/main) and "theirs" is the commit being replayed (this run's
          # results). "-X ours" therefore threw away the sweep's own data on every
          # conflict and kept the stale copy from the remote - which is exactly
          # why data/state.json sat frozen at 10 September while runs kept
          # finishing. We want the sweep's side, so: theirs.
          for i in 1 2 3 4 5; do
            git fetch origin main || true
            git rebase -X theirs origin/main || { git rebase --abort || true; sleep 5; continue; }
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "::error::could not push after 5 attempts"
          exit 1

      # A run can finish green, push commits, and still have quietly lost its
      # results - that is precisely what happened between 10 and 12 September.
      # data/state.json is the one file that proves the run landed, so read it
      # back from what is actually on origin and check it moved. A silent loss
      # becomes a red X instead of two days of nothing.
      - name: Did the run's results actually land?
        if: steps.guard.outputs.skip == 'false' && steps.sweep.outcome == 'success'
        run: |
          git fetch origin main
          git show origin/main:data/state.json > /tmp/pushed-state.json
          python3 -c "import json,datetime as d,sys;t=json.load(open('/tmp/pushed-state.json'))['last_run']['finished_utc'];age=(d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(t.replace('Z','+00:00'))).total_seconds()/60;print(f'state.json on origin says the last run finished {age:.0f} minutes ago ({t})');sys.exit(0 if age < 90 else 1)" || {
            echo "::error::The sweep finished but its results are not on origin - state.json was not updated. Work has been lost; do not trust the dashboard."
            exit 1
          }

      - name: Fail the run if the sweep failed
        if: steps.guard.outputs.skip == 'false' && steps.sweep.outcome == 'failure'
        run: |
          echo "The sweep reported a failure. The site has been rebuilt showing it."
          exit 1
